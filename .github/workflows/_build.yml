# ビルド（＋テスト）の共通処理。build.yml から workflow_call で呼び出される。
name: _build

on:
  workflow_call:
    inputs:
      xcode-version:
        description: maxim-lobanov/setup-xcode に渡す Xcode バージョン
        type: string
        # README の Environment と揃える。ランナー側の更新でビルドが変わらないよう固定する
        default: '26.6'
      ui-tests:
        description: UI テスト（<プロジェクト名>UITests）も実行するか。false なら Unit テストだけ実行する
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-latest
    # FFmpeg を作る回（キャッシュの無い初回）は 10 分ほど長くかかる
    timeout-minutes: 50

    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Allow SwiftLint build tool plugin
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      - name: Restore FFmpeg
        # FFmpeg（Packages/TheaterMedia/Vendor/FFmpeg.xcframework）はリポジトリに入れず、scripts/build-ffmpeg.sh でソースから作る。
        # スクリプト・パッチ・Xcode・最低サポート OS が同じあいだはキャッシュを使う（作るのは初回だけ。Simulator の分で 2〜3 分）。
        # 依存のキャッシュは完全一致のキーだけにする（restore-keys で古い物を戻さない）
        id: ffmpeg
        uses: actions/cache@v6
        with:
          path: Packages/TheaterMedia/Vendor
          key: ffmpeg-xrsimulator-xcode${{ inputs.xcode-version }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'scripts/ffmpeg/**', 'Configs/Project.xcconfig') }}

      - name: Build FFmpeg
        if: ${{ steps.ffmpeg.outputs.cache-hit != 'true' }}
        run: scripts/build-ffmpeg.sh xrsimulator

      - name: Set up environment
        # プロジェクト名と同名の共有スキームが存在することを前提にする
        run: |
          project=$(basename -s .xcodeproj ./*.xcodeproj)
          echo "PROJECT_NAME=$project" >> "$GITHUB_ENV"
          echo "SCHEME=$project" >> "$GITHUB_ENV"
          # 最新の visionOS ランタイムに存在する Apple Vision Pro のシミュレータを UDID で選ぶ
          # （名前だけの指定は OS:latest を暗黙に要求し、古いランタイムにしかないデバイスだと解決できない）
          find_simulator() {
            xcrun simctl list devices available -j | jq -c '.devices | to_entries | map(select(.key | contains("SimRuntime.xrOS"))) | sort_by(.key | capture("xrOS-(?<maj>[0-9]+)-(?<min>[0-9]+)") | [(.maj|tonumber),(.min|tonumber)]) | reverse | map(.value[] | select(.name | startswith("Apple Vision Pro"))) | .[0] // empty'
          }
          simulator=$(find_simulator)
          if [[ -z "$simulator" ]]; then
            # ランナーのイメージから visionOS のランタイムが外れたときに備えて、無ければ選んだ Xcode に合うものを入れる
            echo "visionOS の Simulator が見つからないため、ランタイムをダウンロードします"
            xcodebuild -downloadPlatform visionOS
            simulator=$(find_simulator)
          fi
          if [[ -z "$simulator" ]]; then
            echo "::error::Apple Vision Pro の Simulator が見つかりません" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "SIMULATOR_ID=$(jq -r .udid <<<"$simulator")" >> "$GITHUB_ENV"
          echo "project=$project scheme=$project simulator=$(jq -r '"\(.name) (\(.udid))"' <<<"$simulator")"

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -derivedDataPath DerivedData

      - name: SwiftLint
        # Build Tool Plugin と同じバージョンの SwiftLint（SPM が解決したバイナリ）で .swiftlint.yml を検証する
        run: |
          swiftlint=$(find DerivedData/SourcePackages/artifacts -type f -name swiftlint -path '*macos*' | head -1)
          if [[ -z "$swiftlint" ]]; then
            echo "::error::SPM が解決した SwiftLint バイナリが見つかりません" >&2
            exit 1
          fi
          "$swiftlint" version
          "$swiftlint" lint --strict --reporter github-actions-logging

      - name: Build and test
        # UI テストは共有ランナー上で起動待ちに失敗することがあるため、失敗したテストだけ 1 回再試行する
        # （-test-iterations は初回を含む実行回数の上限）
        env:
          UI_TESTS: ${{ inputs.ui-tests }}
        run: |
          options=()
          if [[ "$UI_TESTS" != "true" ]]; then
            # UI テストは Simulator の clone と起動を含めて 2 分前後かかるため、作業ブランチでは省く
            options+=(-skip-testing:"${SCHEME}UITests")
          fi
          # 並列テストを有効にすると Simulator の clone を作って起動するため、clone を作らずに実行する
          xcodebuild test \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -destination "platform=visionOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -parallel-testing-enabled NO \
            ${options[@]+"${options[@]}"}

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult
